__build_info:
  rime_version: 1.17.0
  timestamps:
    default: 1792334290
    default.custom: 0
    key_bindings: 1790864701
    key_bindings.custom: 0
    symbols: 1791476714
    symbols.custom: 0
    yuhao_pinyin.custom: 0
    yuhao_pinyin.schema: 1792506985
    yuhao_quanpin.custom: 0
    yuhao_quanpin.schema: 1792506985
engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
key_binder:
  bindings:
    - {accept: "Control+period", toggle: ascii_punct, when: always}
    - {accept: "Control+Shift+period", toggle: ascii_punct, when: always}
    - {accept: "Control+Shift+J", toggle: simplification, when: always}
    - {accept: "Control+Shift+F", toggle: traditionalization, when: always}
    - {accept: semicolon, send: 2, when: has_menu}
    - {accept: apostrophe, send: 3, when: has_menu}
    - {accept: minus, send: Page_Up, when: has_menu}
    - {accept: equal, send: Page_Down, when: has_menu}
    - {accept: Tab, send: Page_Down, when: has_menu}
    - {accept: Escape, send: "Shift+BackSpace", when: composing}
menu:
  page_size: 5
punctuator:
  full_shape:
    " ": {commit: "　"}
    "!": {commit: "！"}
    "\"": {pair: ["“", "”"]}
    "#": "＃"
    "$": {commit: "￥"}
    "%": {commit: "％"}
    "&": "＆"
    "'": {pair: ["‘", "’"]}
    "(": "（"
    ")": "）"
    "*": "＊"
    "+": "＋"
    ",": {commit: "，"}
    "-": "－"
    .: {commit: "。"}
    "/": {commit: "／"}
    ":": {commit: "："}
    ";": {commit: "；"}
    "<": {commit: "《"}
    "=": {commit: "＝"}
    ">": {commit: "》"}
    "?": {commit: "？"}
    "@": "＠"
    "[": {commit: "【"}
    "\\": "、"
    "]": {commit: "】"}
    "^": {commit: "……"}
    _: "——"
    "`": "｀"
    "{": {commit: "{"}
    "|": {commit: "｜"}
    "}": {commit: "}"}
    "~": "～"
  half_shape:
    "!": {commit: "！"}
    "\"": {pair: ["“", "”"]}
    "#": "#"
    "$": {commit: "￥"}
    "%": "%"
    "&": "&"
    "'": {pair: ["‘", "’"]}
    "(": "（"
    ")": "）"
    "*": "*"
    "+": "+"
    ",": {commit: "，"}
    "-": "-"
    .: {commit: "。"}
    "/": "/"
    ":": {commit: "："}
    ";": {commit: "；"}
    "<": {commit: "《"}
    "=": {commit: "="}
    ">": {commit: "》"}
    "?": {commit: "？"}
    "@": "@"
    "[": "「"
    "\\": "、"
    "]": "」"
    "^": {commit: "……"}
    _: "——"
    "`": "`"
    "{": "『"
    "|": "|"
    "}": "』"
    "~": {commit: "~"}
  import_preset: symbols
recognizer:
  patterns:
    punct: "^/([0-9]+[a-z]*|[a-z]+)$"
schema:
  author:
    - "佛振 <chen.sst@gmail.com>"
    - "佚名"
  description: |
    基於朙月拼音和袖珍簡化拼音詞庫製作
    用於宇浩輸入法的拼音反查
    兼容大陸簡體、大陸古籍繁體、臺灣繁體、香港繁體
    繁簡漢字相同權重

  name: "宇浩·繁簡通·全拼"
  schema_id: yuhao_quanpin
  version: 20230418
speller:
  algebra:
    - "derive/^([nl])ue$/$1ve/"
    - "derive/^([jqxy])u/$1v/"
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
switches:
  - name: ascii_mode
    reset: 0
    states: ["中文", "西文"]
  - name: full_shape
    states: ["半角", "全角"]
  - name: ascii_punct
    states: ["。，", "．，"]
translator:
  dictionary: yuhao_quanpin
  preedit_format:
    - "xform/([nl])v/$1ü/"
    - "xform/([nl])ue/$1üe/"
    - "xform/([jqxy])v/$1u/"