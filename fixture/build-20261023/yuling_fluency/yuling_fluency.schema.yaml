__build_info:
  rime_version: 1.17.0
  timestamps:
    default: 1792334290
    default.custom: 0
    key_bindings: 1790864701
    key_bindings.custom: 0
    symbols: 1791476714
    symbols.custom: 0
    yuling_fluency.custom: 0
    yuling_fluency.schema: 1792506985
engine:
  filters:
    - uniquifier
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - "history_translator@history"
    - "table_translator@yuling"
    - script_translator
    - "script_translator@pinyin"
history:
  initial_quality: 1
  input: z
  size: 9
key_binder:
  bindings:
    - {accept: "Control+period", toggle: ascii_punct, when: always}
    - {accept: "Control+Shift+period", toggle: ascii_punct, when: always}
    - {accept: semicolon, send: 2, when: has_menu}
    - {accept: apostrophe, send: 3, when: has_menu}
    - {accept: minus, send: Page_Up, when: has_menu}
    - {accept: equal, send: Page_Down, when: has_menu}
    - {accept: Escape, send: "Shift+BackSpace", when: composing}
    - {accept: "Control+Shift+N", select: yuling, when: always}
    - {accept: "Control+Shift+B", select: yuling_pop, when: always}
menu:
  page_size: 5
pinyin:
  dictionary: yuhao_quanpin
  enable_completion: false
  initial_quality: 1
  preedit_format:
    - "xform/([nl])v/$1ü/"
    - "xform/([nl])ue/$1üe/"
    - "xform/([jqxy])v/$1u/"
punctuator:
  full_shape:
    " ": {commit: "　"}
    "!": {commit: "！"}
    "\"": {pair: ["“", "”"]}
    "#": "＃"
    "$": {commit: "￥"}
    "%": {commit: "％"}
    "&": "＆"
    "'": {pair: ["‘", "’"]}
    "(": "（"
    ")": "）"
    "*": "＊"
    "+": "＋"
    ",": {commit: "，"}
    "-": "－"
    .: {commit: "。"}
    "/": {commit: "／"}
    ":": {commit: "："}
    ";": {commit: "；"}
    "<": {commit: "《"}
    "=": {commit: "＝"}
    ">": {commit: "》"}
    "?": {commit: "？"}
    "@": "＠"
    "[": {commit: "【"}
    "\\": "、"
    "]": {commit: "】"}
    "^": {commit: "……"}
    _: "——"
    "`": "｀"
    "{": {commit: "{"}
    "|": {commit: "｜"}
    "}": {commit: "}"}
    "~": "～"
  half_shape:
    "!": {commit: "！"}
    "\"": {pair: ["“", "”"]}
    "#": "#"
    "$": {commit: "￥"}
    "%": "%"
    "&": "&"
    "'": {pair: ["‘", "’"]}
    "(": "（"
    ")": "）"
    "*": "*"
    "+": "+"
    ",": {commit: "，"}
    "-": "-"
    .: {commit: "。"}
    "/": "/"
    ":": {commit: "："}
    ";": {commit: "；"}
    "<": {commit: "《"}
    "=": {commit: "="}
    ">": {commit: "》"}
    "?": {commit: "？"}
    "@": "@"
    "[": "「"
    "\\": "、"
    "]": "」"
    "^": {commit: "……"}
    _: "——"
    "`": "`"
    "{": "『"
    "|": "|"
    "}": "』"
    "~": {commit: "~"}
  import_preset: symbols
recognizer:
  import_preset: default
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    punct: "^/([0-9]0?|[A-Za-z]+)?$"
    uppercase: "^(?![`;]).*[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"
schema:
  author:
    - "作者 朱宇浩"
    - "官方網站 <https://shurufa.app>"
    - "官方QQ群 735728797"
  dependencies:
    - yuhao_quanpin
  description: |
    靈明輸入法之語流版,重碼漢字會根據相鄰漢字和詞語自動調整候選項.
    由於靈明的無空格自分割屬性,本模式不用解決任何分割歧義問題.
    本模式又可稱爲「靈明一二三四碼混着打」.

  name: "靈明·語流"
  schema_id: yuling_fluency
  version: "乙巳冬至"
speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcba/"
  delimiter: "`"
  initials: "zyxwvutsrqponmlkjihgfedcba/"
switches:
  - name: ascii_mode
    reset: 0
    states: ["中文", "西文"]
  - name: full_shape
    reset: 0
    states: ["半角", "全角"]
  - name: ascii_punct
    reset: 0
    states: ["。，", "．，"]
translator:
  comment_format:
    - "xform/^~/ /"
  db_class: tabledb
  dictionary: yuling_fluency
  initial_quality: 8
  preedit_format:
    - "xlit|`|·|"
yuling:
  db_class: tabledb
  dictionary: yuling
  enable_completion: false
  enable_encoder: false
  enable_sentence: false
  enable_user_dict: false
  encode_commit_history: false
  initial_quality: 16
  max_phrase_length: 4