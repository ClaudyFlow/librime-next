__build_info:
  rime_version: 1.17.0
  timestamps:
    default: 1792334290
    default.custom: 0
    key_bindings: 1790864701
    key_bindings.custom: 0
    symbols: 1791476714
    symbols.custom: 0
    yuling.custom: 0
    yuling.schema: 1792506985
    yuling_pop.custom: 0
    yuling_pop.schema: 1769011658
engine:
  filters:
    - "lua_filter@*yuhao.yuhao_hide_space_candidates"
    - "lua_filter@*yuhao.yuhao_autocompletion_filter"
    - "lua_filter@*yuhao.yuhao_single_char_only_for_full_code"
    - "lua_filter@*yuhao.yuhao_charset_filter_common"
    - "lua_filter@*yuhao.yuhao_charset_filter_tonggui"
    - "lua_filter@*yuhao.yuhao_charset_filter_harmonic"
    - "simplifier@traditionalize"
    - "simplifier@simplify"
    - "lua_filter@*yuhao.yuhao_charset_prioritizer_common"
    - "lua_filter@*yuhao.yuhao_charset_prioritizer_tonggui"
    - "lua_filter@*yuhao.yuhao_charset_prioritizer_harmonic"
    - "lua_filter@*yuhao.yuhao_popper_hints"
    - "lua_filter@*yuhao.yuhao_short_code_hint"
    - "lua_filter@*yuhao.yuhao_compatible_chaifen_filter"
    - "lua_filter@*yuhao.yuhao_chaifen_filter"
    - uniquifier
  processors:
    - "lua_processor@*yuhao.yuhao_switch_proc@yuhao_macro"
    - ascii_composer
    - recognizer
    - key_binder
    - "lua_processor@*yuhao.yuhao_auto_select_postponed"
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - "history_translator@history"
    - reverse_lookup_translator
    - table_translator
    - "lua_translator@*yuhao.yuhao_switch_tr@yuhao_macro"
history:
  initial_quality: 1
  input: z
  size: 9
key_binder:
  bindings:
    - {accept: "Control+period", toggle: ascii_punct, when: always}
    - {accept: "Control+Shift+period", toggle: ascii_punct, when: always}
    - {accept: "Control+Shift+J", toggle: simplification, when: always}
    - {accept: "Control+Shift+F", toggle: traditionalization, when: always}
    - {accept: "Control+Shift+M", toggle: yuhao_charset_prioritizer_common, when: always}
    - {accept: "Control+Shift+O", toggle: yuhao_charset_filter_common, when: always}
    - {accept: 0, toggle: yuhao_charset_filter_common, when: has_menu}
    - {accept: "/", toggle: yuhao_chaifen.off, when: has_menu}
    - {accept: "Control+Shift+L", toggle: yuhao_compatible_chaifen_filter, when: always}
    - {accept: "Control+Shift+D", toggle: yuhao_single_char_only_for_full_code, when: always}
    - {accept: Tab, toggle: yuhao_single_char_only_for_full_code, when: has_menu}
    - {accept: "Control+Shift+K", toggle: yuhao_hide_space_candidates, when: always}
    - {accept: "Control+Shift+Y", toggle: yuhao_autocompletion_filter, when: always}
    - {accept: semicolon, send: 2, when: has_menu}
    - {accept: apostrophe, send: 3, when: has_menu}
    - {accept: minus, send: Page_Up, when: has_menu}
    - {accept: equal, send: Page_Down, when: has_menu}
    - {accept: "Control+Shift+N", select: yuling_pop, when: always}
    - {accept: "Control+Shift+B", select: yuling_fluency, when: always}
    - {accept: "Control+Shift+N", select: yuling_fluency, when: always}
    - {accept: "Control+Shift+B", select: yuling, when: always}
