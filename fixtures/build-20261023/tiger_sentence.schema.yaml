    - "lua_filter@tiger_sentence_buffer_filter"
  processors:
    - "lua_processor@tiger_sentence_ascii"
    - recognizer
    - "lua_processor@tiger_sentence_processor"
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - "lua_translator@tiger_sentence_translator"
key_binder:
  bindings:
    - {accept: Tab, send: Down, when: has_menu}
    - {accept: "Shift+Tab", send: Up, when: has_menu}
    - {accept: minus, send: Page_Up, when: paging}
    - {accept: equal, send: Page_Down, when: has_menu}
