[dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order`：把 `serde_json::Value::Object` 的后备映射从 `BTreeMap` 换成
# `IndexMap`。**这不是性能选择，是正确性选择**：配置树的键序必须来自源文件，而不是
# serde_json 默认的字节序重排（否则产物键序永远和手写源对不上）。
# 影响面仅"对象的迭代/序列化顺序"（JSON 语义不变；`Value` 的 `PartialEq` 本就与键序无关）。
serde_json = { version = "1", features = ["preserve_order"] }
# 2026-10-24：`serde_yaml` 已归档（版本号里就是 `0.9.34+deprecated`），换成它的维护分支
# `serde_norway`（API 一致，只改 crate 前缀）。仍然是"serde 的 YAML 插头"，语义不变。
serde_norway = "0.9"
# 配置树自己的映射（`config::types::MapRef`）也用它：`IndexMap::insert` 的语义恰好是
# "已有键保持原位、新键追加到尾部"，正是合并（`__include` / `__merge` / `__patch`）要的规则。
indexmap = "2"
# marisa-trie 的**纯 Rust** 移植（tokuhirom，BSD-2-Clause），读 Rime 的 `.table.bin`
# 里的字符串表用。之前试过"链接 librime deps 里编好的 libmarisa.a + 一个 C++ shim"，
# 能跑但是引入了 C++；换成这个 crate 后整条链都是 Rust。
# API 见 `dict/marisa.rs`：`Reader::from_bytes` + `Trie::read` 可直接吃内存里的 blob。
rsmarisa = "0.4"
# 正则用 `fancy-regex`（2026-10-25）：`regex` crate 是线性的、但**不支持反向引用与环视**，
# 而真实方案里两样都在用 —— `double_pinyin_ziranma`/`_flypy` 的 `xform/([aoe])\1(\w)/$1$2/`、
# 16 份宇浩系方案的 `recognizer/patterns/uppercase` 环视。fancy-regex 是 `regex` 的超集，
# 普通模式仍委托给它，速度不退化；语义对齐 librime 的 `boost::regex`。
# 仍有的两处手工翻译见 `algo/calculus.rs`。
rusty-leveldb = "4.0.2"
# Lua 兼容层(2026-11-01):巧码等社区方案的 lua_processor/translator/filter。
# vendored = 自带 Lua 5.4 源码编译,不依赖系统 lua。
# send = 让 `Lua`/`Function`/`Table` 满足 Send+Sync —— 组件要装进
# `Box<dyn Filter + Send + Sync>`(引擎挂在 static 背后),没有它 lua 组件根本
# 塞不进注册表。代价是 VM 内部加锁,单线程使用没有实际开销。
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
# 真内存映射(2026-11-01):词典/模型大文件不再 fs::read 全量堆驻
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
] }
fancy-regex = "0.20.0"

