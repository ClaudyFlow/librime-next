[package]
name = "librime-next"
version = "0.1.0"
edition = "2024"
publish = false

# ⚠️ 只给**这个工具**加真 YAML 依赖；线上 IME 用的仍是 common/src/yaml.rs 的零依赖极简解析器，
# 不因为这里而改变装载行为。
#
# 为什么需要它：librime 用 yaml-cpp 写出的产物里有嵌套流式映射
# （宇浩的 `yuhao_macro` 就是 `[{items: [{names: [...], states: [...]}]}]`），
# 手写解析器去啃它不值当；配置层重写要的是**无损读写**，不是"够用就行"。
#
# network 已验证可用（index.crates.io 200）。
[lib]
name = "librime_next"
path = "src/lib.rs"
# 产出 rime.dll 替代品：cdylib 给 Weasel 前端链接；lib 留给本仓库测试/集成
crate-type = ["lib", "cdylib"]

[[bin]]
name = "librime-next"
path = "src/main.rs"

# ---------------------------------------------------------------------------
# 为什么下面的 [[test]] / [[example]] 要逐个手写
#
# 本仓库的目录命名规则：**强制单数**（"永远只有一个的文件夹不许用复数"）。
# 所以 cargo 约定俗成的复数目录名 `tests/` 与 `examples/` 在本仓库改用单数
# `test/` 与 `example/`；一旦离开约定目录名，cargo 的自动发现就失效，必须显式登记。
#
# 代价：新增一个集成测试 / example 时，除了丢文件进目录，**还要在这里加一段**。
# 漏加的话文件不会参与构建，且 cargo 不会报错（静默跳过）——这是本次改名的主要风险。
# ---------------------------------------------------------------------------

