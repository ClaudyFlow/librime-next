schema:
  schema_id: wubi86
  name: "五笔86 (e2e 验证)"
engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
speller:
  delimiter: " ;'"
translator:
  dict: wubi86
  # 出厂 wubi86 的 translator 段（只保留 e2e 真会验证到的两项）：
  # 过滤 CJK 扩展区汉字 / 多词连打时组整句。
  enable_charset_filter: true
  enable_sentence: true
menu:
  page_size: 9
switches:
  - name: ascii_mode
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    states: [ 。，, ．， ]
